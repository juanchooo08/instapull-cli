[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "instapull"
version = "1.0.0"
description = "Extrae y analiza los posts guardados de una coleccion de Instagram con IA"
readme = "README.md"
requires-python = ">=3.10,<3.14"
license = { text = "MIT" }

[project.scripts]
instapull = "instapull.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
filterwarnings = ["ignore::DeprecationWarning"]
